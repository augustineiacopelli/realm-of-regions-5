<title>Realm-of-Regions 5: Adventure Calls</title>
<meta name="description" content="A turn-based adventure game by Simon with 18 regions, 144 enemies, 18 dragons, pets, skills, and a Bestiary.">
<meta name="theme-color" content="#14110f">
<style>
:root{--bg:#14110f;--panel:#221c17;--panel2:#2e251d;--line:#4a3a2b;--gold:#f2b134;--sand:#e9d3a0;--text:#f4ead6;--muted:#b3a58b;--red:#e4572e;--green:#5fbf6a;--blue:#58a6d6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Trebuchet MS",Verdana,sans-serif}
#app{display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{padding:10px 14px;background:var(--panel);border-bottom:2px solid var(--line)}
.title{font-size:.95rem;color:var(--gold);font-weight:700;letter-spacing:.03em}
.stats{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:6px;font-size:.85rem;color:var(--sand)}
.bar{height:12px;background:#0c0a08;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--green);transition:width .25s}
.bar.e>i{background:var(--red)}
main{flex:1;overflow-y:auto;padding:14px}
h2{margin:0 0 10px;font-size:1.2rem;color:var(--gold)}
h3{margin:16px 0 8px;font-size:1rem;color:var(--sand)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.reg{min-height:78px;border:2px solid var(--line);border-radius:16px;background:var(--panel);color:var(--text);font:inherit;font-size:.82rem;padding:8px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.reg .em{font-size:1.5rem}
.reg.open{border-color:var(--gold);background:var(--panel2)}
.reg.lock{opacity:.45}
.btn{display:block;width:100%;min-height:48px;margin:8px 0;border:2px solid var(--gold);border-radius:14px;background:var(--panel2);color:var(--text);font:inherit;font-size:1rem;font-weight:700;padding:10px 14px}
.btn:active{background:var(--gold);color:#1b1408}
.btn.alt{border-color:var(--line);font-weight:400}
.btn.danger{border-color:var(--red)}
.btn[disabled]{opacity:.4}
.row{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}
.item{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item small{display:block;color:var(--muted)}
.buy{min-width:84px;min-height:44px;border:2px solid var(--gold);border-radius:12px;background:var(--panel2);color:var(--text);font:inherit;font-weight:700}
.buy[disabled]{opacity:.4}
.arena{text-align:center}
.big{font-size:4rem;line-height:1.1}
.log{background:#0c0a08;border:1px solid var(--line);border-radius:12px;padding:10px;min-height:104px;font-size:.92rem;color:var(--sand)}
.log div{margin:3px 0}
.muted{color:var(--muted);font-size:.88rem}
textarea{display:block;width:100%;min-height:120px;background:#0c0a08;color:var(--sand);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:.8rem;font-family:monospace;margin:8px 0}
.pill{display:inline-block;background:#0c0a08;border:1px solid var(--line);border-radius:999px;padding:3px 10px;margin:3px 3px 0 0;font-size:.82rem}
</style>
</head>

/* ---------- Save and state ---------- */
const KEY = "ror5_adventure_calls_v2";
function fresh(){
  return {hp:CONFIG.startHp, maxHp:CONFIG.startHp, gold:CONFIG.startGold, lv:1, xp:0, dlcDone:false, mp:CONFIG.startMp, maxMp:CONFIG.startMp, sword:null,
    inv:{carrot:0, apple:0, teddy:0, gcarrot:0, gapple:0, egapple:0}, pets:[], tattle:false, beaten:{}, kills:0};
}
let S = fresh();
try {
  const raw = localStorage.getItem(KEY);
  if (raw) {
    const sv = JSON.parse(raw);
    S = Object.assign(fresh(), sv);
    if (sv.maxMp === undefined) { S.maxMp = CONFIG.startMp + CONFIG.mpPerLevel*(S.lv-1); S.mp = S.maxMp; }
  }
} catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

let screen = "map", region = null, backTo = "map", B = null, confirmReset = false, townMsg = "";

/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
const rnd = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
function swordBonus(){ return S.sword ? SWORDS.find(s=>s.id===S.sword).atk : 0; }
function atkRange(){ const b = swordBonus() + (S.lv-1)*CONFIG.atkPerLevel; return [CONFIG.atkMin+b, CONFIG.atkMax+b]; }
function xpNeeded(lv){ return CONFIG.xpBase + CONFIG.xpStep*(lv-1); }
function xpFor(e){ return e.xp || Math.max(1, Math.round((e.max + 3*e.atk + 3*e.def)/8)); }
function pick(list){ const t = list.reduce((s,e)=>s+e.weight,0); let r = Math.random()*t; for (const e of list){ r -= e.weight; if (r<=0) return e; } return list[0]; }
function petList(){ return S.pets.map(p => PETS.find(x=>x.id===p.id)); }

function drawHeader(){
  const [lo,hi] = atkRange();
  $("stats").innerHTML = `<span>⭐ Lv ${S.lv} (XP ${S.xp}/${xpNeeded(S.lv)})</span><span>❤️ ${S.hp}/${S.maxHp}</span><span>🔷 MP ${S.mp}/${S.maxMp}</span><span>🪙 ${S.gold}g</span><span>⚔️ ATK ${lo} to ${hi}</span><span>🛡️ DEF ${CONFIG.def}</span>`;
  $("hpbar").style.width = Math.max(0, S.hp/S.maxHp*100) + "%";
}
function go(s, extra){ screen = s; if (extra) Object.assign(window, extra); render(); $("main").scrollTop = 0; }

/* ---------- Screens ---------- */
function render(){
  drawHeader(); save();
  const m = $("main");
  if (screen==="map") m.innerHTML = mapHTML();
  else if (screen==="region") m.innerHTML = regionHTML();
  else if (screen==="town") m.innerHTML = townHTML();
  else if (screen==="dex") m.innerHTML = dexHTML();
  else if (screen==="save") m.innerHTML = saveHTML();
  else if (screen==="battle") m.innerHTML = battleHTML();
}

function mapHTML(){
  const cards = REGIONS.map((r,i) => {
    if (r.dlc) return S.dlcDone ? `<button class="reg open" onclick="enterRegion('${r.id}')"><span class="em">${r.em}</span>${r.name}</button>` : "";
    const unlocked = i===0 || S.beaten[REGIONS[i-1].id];
    if (ENEMIES[r.id] && unlocked) return `<button class="reg open" onclick="enterRegion('${r.id}')"><span class="em">${r.em}</span>${r.name}</button>`;
    const msg = unlocked ? `${r.name} is still being built. Come back soon!` : `Beat the ${BOSSES[REGIONS[i-1].id].name} to unlock ${r.name}.`;
    return `<button class="reg lock" onclick="comingSoon(${JSON.stringify(msg).replace(/"/g,'&quot;')})"><span class="em">🔒</span>${r.name}</button>`;
  }).join("");
  const petsOwned = petList().map(p=>`<span class="pill">${p.em} ${p.name}</span>`).join("") || `<span class="muted">No pets yet</span>`;
  return `<h2>Choose your region</h2>
    <div class="grid">${cards}</div>
    ${dlcHTML()}
    <button class="btn" onclick="openTown('map')">🏪 Inn and Store</button>
    <button class="btn alt" onclick="go('dex')">📖 Bestiary</button>
    <button class="btn alt" onclick="go('save')">💾 Save code</button>
    <div class="card"><b>Your pack</b><br>
      <span class="pill">🥕 Carrot ${S.inv.carrot||0}</span><span class="pill">🍎 Apple ${S.inv.apple||0}</span><span class="pill">🧸 Teddy Bear ${(S.inv.teddy||0)>0?"yes":"no"}</span>
      <span class="pill">🥕✨ Gold Carrot ${S.inv.gcarrot||0}</span><span class="pill">🍏✨ Gold Apple ${S.inv.gapple||0}</span><span class="pill">🍎💎 Enchanted Gold Apple ${S.inv.egapple||0}</span><span class="pill">🥕💎 Enchanted Gold Carrot ${S.inv.egcarrot||0}</span>
      <span class="pill">📖 Tattle Book ${S.tattle?"yes":"no"}</span><br>${petsOwned}<br>
      <span class="muted">Dragons beaten: ${Object.keys(S.beaten).length} of ${S.beaten.snowy?18:15}</span></div>
    <div id="toast" class="muted">${townMsg}</div>
    <div class="muted" style="margin-top:14px">Realm-of-Regions 5: Adventure Calls, made by Simon</div>`;
}
function dlcHTML(){
  if (S.dlcDone) return "";
  const open = !!S.beaten.snowy;
  const cards = REGIONS.filter(r=>r.dlc).map(r => open
    ? `<button class="reg open" onclick="enterRegion('${r.id}')"><span class="em">${r.em}</span>${r.name}<span class="muted" style="font-size:.68rem">${r.from}</span></button>`
    : `<button class="reg lock" onclick="comingSoon('Beat the Snowy Plain Dragon to unlock the DLC.')"><span class="em">🔒</span>DLC Region</button>`).join("");
  return `<h3>${open?"⭐ DLC regions unlocked":"🔒 DLC: beat the Snowy Plain Dragon to unlock 3 new regions"}</h3><div class="grid">${cards}</div>`;
}
function dexHTML(){
  const d = S.dex || {}; let tot = 0, seen = 0;
  const secs = REGIONS.filter(r=>!r.dlc || S.beaten.snowy).map(r=>{
    const list = (ENEMIES[r.id]||[]).concat([BOSSES[r.id]]);
    const rows = list.map(e=>{ tot++; const n = d[e.name]||0; if (n) seen++;
      return n ? `<div class="item"><div><b>${e.em||"🐲"} ${e.name}</b><small>HP ${e.hp} · ATK ${e.atk} · DEF ${e.def}${e.note?"<br>"+e.note:""}</small></div><span class="pill">x${n}</span></div>`
               : `<div class="item"><div><b>❓ ???</b><small>Not defeated yet</small></div></div>`; }).join("");
    return `<h3>${r.em} ${r.name}</h3><div class="card">${rows}</div>`; }).join("");
  return `<h2>📖 Bestiary</h2><div class="muted">Discovered ${seen} of ${tot}. Defeat an enemy to fill in its page.</div>${secs}<button class="btn alt" onclick="go('map')">⬅️ Back to the map</button>`;
}
let saveMsg = "", impText = "", confirmLoad = false;
function encodeSave(){ return "ROR5:" + btoa(unescape(encodeURIComponent(JSON.stringify(S)))); }
function saveHTML(){
  return `<h2>💾 Save code</h2>
    <div class="card muted">Your game saves by itself in this browser. To move your adventure to another website or device, copy this code, then paste it into the game there and tap Load.</div>
    <b>Your code</b>
    <textarea id="exp" readonly onclick="this.select()">${encodeSave()}</textarea>
    <button class="btn" onclick="copyCode()">Copy my code</button>
    <b>Load a code</b>
    <textarea id="imp" placeholder="Paste a code here that starts with ROR5:" oninput="impText=this.value;confirmLoad=false">${impText}</textarea>
    <button class="btn danger" onclick="loadCode()">${confirmLoad?"Tap again to replace my progress":"Load this code"}</button>
    <div class="muted">${saveMsg}</div>
    <button class="btn alt" onclick="saveMsg='';impText='';confirmLoad=false;go('map')">⬅️ Back to the map</button>`;
}
function copyCode(){
  const t = $("exp");
  try { navigator.clipboard.writeText(t.value).then(()=>{saveMsg="Copied!";render();}, ()=>{t.select();document.execCommand("copy");saveMsg="Copied, or tap the code box and copy it yourself.";render();}); }
  catch (e) { t.select(); try { document.execCommand("copy"); } catch (e2) {} saveMsg="Tap the code box and copy it yourself if needed."; render(); }
}
function loadCode(){
  const v = ($("imp").value||"").trim();
  try {
    if (!v.startsWith("ROR5:")) throw new Error("bad");
    const o = JSON.parse(decodeURIComponent(escape(atob(v.slice(5)))));
    if (typeof o.lv!=="number" || typeof o.gold!=="number" || typeof o.maxHp!=="number") throw new Error("bad");
    if (!confirmLoad){ confirmLoad = true; impText = v; saveMsg = "This will replace your current progress. Tap the button again to continue."; render(); return; }
    S = Object.assign(fresh(), o); confirmLoad = false; impText = ""; saveMsg = ""; townMsg = "Your adventure was loaded!"; go("map");
  } catch (e) { confirmLoad = false; impText = v; saveMsg = "That code did not work. Make sure you copied all of it."; render(); }
}
function comingSoon(msg){ townMsg = msg; render(); }

function enterRegion(id){ region = id; townMsg = ""; itemsOpen = false; go("region"); }
function regionHTML(){
  const r = REGIONS.find(x=>x.id===region), b = BOSSES[region];
  const done = S.beaten[region];
  return `<h2>${r.em} ${r.name}</h2>
    <div class="card muted">Fight enemies for gold, then buy gear and face the ${b.name}.${done?" You already beat this dragon!":""}</div>
    <button class="btn" onclick="startFight(false)">🗡️ Explore and fight</button>
    <button class="btn danger" onclick="startFight(true)">${b.em||"🐉"} Challenge the ${b.name}</button>
    <button class="btn alt" onclick="openTown('region')">🏪 Inn and Store</button>
    <button class="btn alt" onclick="useItemsOutside()">🎒 ${itemsOpen?"Close your pack":"Use an item"}</button>
    ${itemsOpen?itemRows(true):""}
    <div class="muted">${townMsg}</div>
    <button class="btn alt" onclick="go('map')">⬅️ Back to the map</button>`;
}
let itemsOpen = false;
function useItemsOutside(){ itemsOpen = !itemsOpen; render(); }
function allItems(){ return HEALS.concat(BOOSTS); }
function itemDesc(h){ return h.heal ? `recovers ${h.heal} HP` : h.mp ? `restores ${h.mp} MP` : `gain ${h.add} more max HP`; }
function itemRows(outside){
  return allItems().map(h=>{ const n = S.inv[h.id]||0;
    return `<button class="btn" ${n<1||!canUse(h)?"disabled":""} onclick="useItem('${h.id}'${outside?",true":""})">${h.name} ${h.reusable?"(reusable, "+itemDesc(h)+")":"x"+n+" ("+itemDesc(h)+")"}</button>`; }).join("");
}

/* ---------- Town ---------- */
function openTown(from){ backTo = from; go("town"); }
function townHTML(){
  const best = S.sword ? SWORDS.findIndex(s=>s.id===S.sword) : -1;
  const sw = SWORDS.map((s,i)=>{
    const owned = i<=best;
    return `<div class="item"><div><b>${s.name}</b><small>ATK +${s.atk}${S.sword===s.id?" (equipped)":""}</small></div>
      <button class="buy" ${owned||S.gold<s.cost?"disabled":""} onclick="buySword('${s.id}')">${owned?"Owned":s.cost+"g"}</button></div>`;
  }).join("");
  const hl = HEALS.map(h=>`<div class="item"><div><b>${h.name}</b><small>${h.heal?"Recovers "+h.heal+" HP":"Restores "+h.mp+" MP"}${h.reusable?". Reusable, you never run out":", you have "+(S.inv[h.id]||0)}</small></div>
      <button class="buy" ${S.gold<h.cost||(h.reusable&&(S.inv[h.id]||0)>0)?"disabled":""} onclick="buyHeal('${h.id}')">${h.reusable&&(S.inv[h.id]||0)>0?"Owned":h.cost+"g"}</button></div>`).join("");
  const bs = BOOSTS.map(h=>`<div class="item"><div><b>${h.name}</b><small>Gain ${h.add} more max HP when you use it, you have ${S.inv[h.id]||0}</small></div>
      <button class="buy" ${S.gold<h.cost?"disabled":""} onclick="buyBoost('${h.id}')">${h.cost}g</button></div>`).join("");
  const pt = PETS.map(p=>{
    const owned = S.pets.some(x=>x.id===p.id);
    return `<div class="item"><div><b>${p.em} ${p.id==="mystery"?"Pet ???":"Pet: "+p.name}</b><small>${p.id==="mystery"?"ATK ??? (a surprise)":"ATK "+p.atk}</small></div>
      <button class="buy" ${owned||S.gold<p.cost?"disabled":""} onclick="buyPet('${p.id}')">${owned?"Owned":p.cost+"g"}</button></div>`;
  }).join("");
  return `<h2>🏪 Inn and Store</h2>
    <div class="card"><div class="item"><div><b>🛏️ Inn Rest</b><small>Restore all your HP and MP</small></div>
      <button class="buy" ${S.gold<CONFIG.innCost||(S.hp>=S.maxHp&&S.mp>=S.maxMp)?"disabled":""} onclick="rest()">${CONFIG.innCost}g</button></div></div>
    <div class="muted">${townMsg}</div>
    <h3>Store</h3>
    <div class="card"><div class="item"><div><b>📖 Tattle Book</b><small>Lets you see an enemy's HP, ATK and DEF in battle</small></div>
      <button class="buy" ${S.tattle||S.gold<3?"disabled":""} onclick="buyTattle()">${S.tattle?"Owned":"3g"}</button></div></div>
    <h3>Swords</h3><div class="card">${sw}</div>
    <h3>Food</h3><div class="card">${hl}</div>
    <h3>Max HP boosts</h3><div class="card">${bs}</div>
    <h3>Pets (they help in battle)</h3><div class="card">${pt}</div>
    <button class="btn alt" onclick="townMsg='';go(backTo)">⬅️ Leave the store</button>`;
}
function spend(c){ if (S.gold<c) return false; S.gold -= c; return true; }
function rest(){ if (S.hp>=S.maxHp && S.mp>=S.maxMp){ townMsg="You are already rested."; render(); return; } if(!spend(CONFIG.innCost)) return; S.hp = S.maxHp; S.mp = S.maxMp; townMsg="You slept well. HP and MP are full!"; render(); }
function buyTattle(){ if(S.tattle||!spend(3)) return; S.tattle = true; townMsg="You bought the Tattle Book."; render(); }
function buySword(id){ const s = SWORDS.find(x=>x.id===id); if(!spend(s.cost)) return; S.sword = id; townMsg=`You equipped the ${s.name}.`; render(); }
function buyHeal(id){ const h = HEALS.find(x=>x.id===id); if(h.reusable && (S.inv[id]||0)>0) return; if(!spend(h.cost)) return; S.inv[id] = (S.inv[id]||0)+1; townMsg=`Bought a ${h.name}.`; render(); }
function buyBoost(id){ const h = BOOSTS.find(x=>x.id===id); if(!spend(h.cost)) return; S.inv[id] = (S.inv[id]||0) + 1; townMsg=`Bought a ${h.name}. Use it from your pack to gain ${h.add} max HP.`; render(); }
function buyPet(id){ const p = PETS.find(x=>x.id===id); if(S.pets.some(x=>x.id===id)||!spend(p.cost)) return;
  const entry = {id}; if (id==="mystery") entry.atk = rnd(20,80); S.pets.push(entry);
  townMsg = id==="mystery" ? "Your mystery pet hatched! Its power is a secret." : `${p.name} joined you!`; render(); }

/* ---------- Battle ---------- */
function startFight(boss){
  if (S.hp<=0) S.hp = 1;
  let e;
  if (boss){ const b = BOSSES[region]; e = Object.assign({}, b, {isBoss:true, gold:[b.gold,b.gold]}); }
  else {
    const forced = S.forceNext && S.forceNext[region] && ENEMIES[region].find(x=>x.name===S.forceNext[region]);
    if (forced) { delete S.forceNext[region]; e = Object.assign({}, forced); }
    else e = Object.assign({}, pick(ENEMIES[region]));
  }
  e.max = e.hp; e.seen = false;
  B = {e, log:[boss?`The ${e.name} blocks your path!`:`A wild ${e.name} appears!`], over:false, won:false, itemMenu:false};
  go("battle");
}
function battleHTML(){
  const e = B.e;
  const stat = (S.tattle && e.seen) ? `<div class="muted">HP ${Math.max(0,e.hp)}/${e.max} · ATK ${e.atk} · DEF ${e.def}${e.note?"<br>"+e.note:""}</div>` : `<div class="muted">HP ${Math.max(0,e.hp)}/${e.max}</div>`;
  const log = B.log.slice(-5).map(l=>`<div>${l}</div>`).join("");
  let controls;
  if (B.over){
    controls = `<button class="btn" onclick="endBattle()">${B.won?"Continue":"Wake up at the inn"}</button>`;
  } else if (B.itemMenu){
    const rows = itemRows(false);
    controls = rows + `<button class="btn alt" onclick="B.itemMenu=false;render()">Back</button>`;
  } else if (B.skillMenu){
    const have = SKILLS.filter(s=>S.lv>=s.lv);
    const next = SKILLS.find(s=>S.lv<s.lv);
    controls = have.map(s=>`<button class="btn" ${S.mp<s.mp||(s.heal||s.healPct)&&S.hp>=S.maxHp?"disabled":""} onclick="useSkill('${s.id}')">${s.em} ${s.name} (${s.mp} MP): ${s.desc}</button>`).join("")
      + (next ? `<div class="muted">Next skill: ${next.name} at level ${next.lv}</div>` : "")
      + `<button class="btn alt" onclick="B.skillMenu=false;render()">Back</button>`;
  } else {
    controls = `<button class="btn" onclick="playerAttack()">⚔️ Attack</button>
      <div class="row"><button class="btn alt" onclick="B.skillMenu=true;render()">✨ Skills</button>
      <button class="btn alt" onclick="B.itemMenu=true;render()">🎒 Items</button></div>
      <div class="row"><button class="btn alt" ${S.tattle?"":"disabled"} onclick="tattle()">📖 Tattle</button>
      <button class="btn alt" onclick="runAway()">🏃 Run away</button></div>`;
  }
  const pets = petList().map(p=>p.em).join(" ");
  return `<div class="arena"><div class="big">${e.em}</div><h2>${e.name}</h2>
    <div class="bar e"><i style="width:${Math.max(0,e.hp/e.max*100)}%"></i></div>${stat}
    ${isDlc()?`<div class="muted">Pets cannot help in the DLC regions.</div>`:(pets?`<div class="muted">Your pets: ${pets}</div>`:"")}</div>
    <div class="log">${log}</div>${controls}`;
}
function tattle(){ B.e.seen = true; B.log.push("You read the Tattle Book."); render(); }
function runAway(){ townMsg = "You ran away safely."; B = null; go("region"); }

function playerAttack(mult, cost, label){
  if (B.over) return;
  mult = mult || 1; cost = cost || 0;
  if (S.mp < cost) return;
  S.mp -= cost; B.skillMenu = false;
  const e = B.e, L = B.log;
  if (label) L.push(`💥 You use ${label}!`);
  if (e.blind && Math.random()<e.blind) L.push(`${e.name} blinds you. You miss!`);
  else if (e.dodge && Math.random()<e.dodge) L.push(`${e.name} spins out of the way!`);
  else {
    const [lo, hi] = atkRange();
    let d = Math.max(1, rnd(lo, hi)*mult - e.def);
    if (e.slow && Math.random()<e.slow){ d = Math.max(1, Math.floor(d/2)); L.push("The sand drags at your sword."); }
    e.hp -= d; L.push(`You hit ${e.name} for ${d}.`);
    if (e.thorns){ S.hp -= e.thorns; L.push(`Thorns prick you for ${e.thorns}.`); }
  }
  afterPlayer();
}
function isDlc(){ const r = REGIONS.find(x=>x.id===region); return !!(r && r.dlc && !S.dlcDone); }
function afterPlayer(){
  const e = B.e, L = B.log;
  for (const p of (isDlc() ? [] : petList())){
    if (e.hp<=0) break;
    if (Math.random() < CONFIG.petChance){
      const entry = S.pets.find(x=>x.id===p.id), power = (entry && entry.atk) || p.atk;
      const d = Math.max(1, rnd(Math.ceil(power*CONFIG.petMinFrac), Math.ceil(power*CONFIG.petMaxFrac)) - e.def);
      e.hp -= d; L.push(`${p.em} ${p.name} attacks for ${d}!`);
    }
  }
  if (S.hp<=0) return lose();
  if (e.hp<=0) return win();
  let d = Math.max(1, e.atk - CONFIG.def);
  if (e.venom && Math.random()<e.venom){ d += 3; L.push("Venom! Extra damage."); }
  S.hp -= d; L.push(`${e.name} hits you for ${d}.`);
  if (S.hp<=0) return lose();
  render();
}
function canUse(h){ return true; }
function useItem(id, outside){
  const h = allItems().find(x=>x.id===id);
  if ((S.inv[id]||0)<1 || !canUse(h)) return;
  if (!h.reusable) S.inv[id]--;
  let msg;
  if (h.heal){ const b = S.hp; S.hp = Math.min(S.maxHp, S.hp + h.heal); msg = `recover ${S.hp-b} HP`; }
  else if (h.mp){ const b = S.mp; S.mp = Math.min(S.maxMp, S.mp + h.mp); msg = `restore ${S.mp-b} MP`; }
  else { S.maxHp += h.add; S.hp += h.add; msg = `gain ${h.add} max HP (now ${S.maxHp})`; }
  if (outside){ townMsg = `You used a ${h.name} and ${msg}.`; render(); return; }
  B.log.push(`You use a ${h.name} and ${msg}.`); B.itemMenu = false;
  afterPlayer();
}
function useSkill(id){
  const s = SKILLS.find(x=>x.id===id);
  if (!s || S.lv<s.lv || S.mp<s.mp) return;
  if (s.mult) { playerAttack(s.mult, s.mp, s.name); return; }
  if (S.hp>=S.maxHp) return;
  S.mp -= s.mp; const b = S.hp;
  const amt = s.healPct ? Math.ceil(S.maxHp*s.healPct) : s.heal;
  S.hp = Math.min(S.maxHp, S.hp+amt);
  B.log.push(`${s.em} You cast ${s.name} and recover ${S.hp-b} HP.`); B.skillMenu = false; afterPlayer();
}
function win(){
  const e = B.e, g = rnd(e.gold[0], e.gold[1]);
  S.gold += g; S.kills++; S.dex = S.dex || {}; S.dex[e.name] = (S.dex[e.name]||0) + 1; B.over = true; B.won = true;
  const xp = xpFor(e); S.xp += xp;
  B.log.push(`You defeated ${e.name}! You found ${g} gold and earned ${xp} XP.`);
  while (S.xp >= xpNeeded(S.lv)){
    S.xp -= xpNeeded(S.lv); S.lv++; S.maxHp += CONFIG.hpPerLevel; S.hp += CONFIG.hpPerLevel; S.maxMp += CONFIG.mpPerLevel; S.mp += CONFIG.mpPerLevel;
    B.log.push(`⭐ LEVEL UP! You are now level ${S.lv}. Max HP +${CONFIG.hpPerLevel}, Max MP +${CONFIG.mpPerLevel}, ATK +${CONFIG.atkPerLevel}.`);
    SKILLS.filter(s=>s.lv===S.lv && s.lv>1).forEach(s=>B.log.push(`🎓 New skill learned: ${s.name}!`));
  }
  if (e.isBoss){
    S.beaten[region] = true;
    const rg = REGIONS.find(x=>x.id===region);
    if (region==="snowy") B.log.push(`🎉 You beat the ${e.name}! DLC unlocked: 3 new regions are now open!`);
    else if (rg && rg.dlc){
      const all = REGIONS.filter(x=>x.dlc).every(x=>S.beaten[x.id]);
      if (all) S.dlcDone = true;
      B.log.push(`🎉 You beat the ${e.name}!` + (all ? " You beat every dragon in all of Realm-of-Regions 5! The DLC is finished, and its regions now join the main map for good." : ""));
    } else {
      const nr = REGIONS[REGIONS.findIndex(x=>x.id===region)+1];
      B.log.push(`🎉 You beat the ${e.name}!` + (nr && ENEMIES[nr.id] ? ` ${nr.name} is now unlocked!` : ""));
    }
  }
  render();
}
function lose(){
  const lost = Math.floor(S.gold*CONFIG.deathGoldLoss);
  S.gold -= lost; S.hp = 0; B.over = true; B.won = false;
  B.log.push(`You fell in battle. You lost ${lost} gold.`);
  render();
}
function endBattle(){
  if (!B.won){ S.hp = S.maxHp; S.mp = S.maxMp; townMsg = "You woke up at the inn with full HP and MP."; }
  else townMsg = "";
  B = null; go("region");
}

render();
</script>
</body>
</html>
